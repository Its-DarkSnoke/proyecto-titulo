<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Predicción de Cáncer</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px 16px; font-family: Arial, sans-serif; display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; background-color: #f4f7fe; }
        .login-box { background: white; padding: clamp(20px, 6vw, 32px); border-radius: 24px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
        input { width: 100%; min-height: 48px; font-size: 16px; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        button { min-height: 48px; font-size: 16px; }
        a { display: inline-block; padding: 12px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Registrar Nuevo Médico</h2>
        <form action="/registro" method="POST">
            <input type="email" name="correo" placeholder="Correo Electrónico" required>
            <input type="password" name="password" placeholder="Crear Contraseña" required>
            <button type="submit">Crear Cuenta</button>
        </form>
        <br>
        <a href="/">Volver al Login</a>
    </div>
</body>
</html>
